<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OSCAR Job Copilot</title>
		<style>
			body {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				width: 260px;
				margin: 0;
				padding: 12px;
				color: #1e293b;
			}
			button {
				width: 100%;
				padding: 8px;
				font-size: 14px;
				cursor: pointer;
				border: 1px solid #1e293b;
				border-radius: 4px;
				background: #1e293b;
				color: white;
			}
			button:disabled {
				opacity: 0.6;
				cursor: default;
			}
			p {
				font-size: 12px;
				color: #475569;
				margin: 8px 0 0;
				word-break: break-word;
			}
			a {
				color: #475569;
			}
		</style>
	</head>
	<body>
		<button id="save" type="button">Save this job</button>
		<p id="status"></p>
		<p><a href="options.html" target="_blank">Settings</a></p>
		<script type="module" src="./popup.js"></script>
	</body>
</html>
