[project]
name = "oscar-api"
version = "0.1.0"
description = "OSCAR Job Copilot — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "openai>=1.50",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscar_api"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Query(...)`/`Header(...)` as an argument default is the
# required FastAPI idiom, not the mutable-default-arg bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
packages = ["oscar_api"]
mypy_path = "src"
strict = true
warn_unreachable = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# ── import-linter: enforce module boundaries (docs/03 §2) ───────────────────
# No contracts yet: `modules/` and `adapters/` don't exist until M1/M3, and a
# contract over a nonexistent package fails the lint rather than passing
# vacuously. Add contracts here as each package lands (ADR-003), e.g.:
#
# [tool.importlinter]
# root_package = "oscar_api"
#
# [[tool.importlinter.contracts]]
# name = "Domain modules must not import adapters (only ports)"
# type = "forbidden"
# source_modules = ["oscar_api.modules"]
# forbidden_modules = ["oscar_api.adapters"]
#
# [[tool.importlinter.contracts]]
# name = "No cycles between domain modules"
# type = "independence"
# modules = ["oscar_api.modules.jobs", "oscar_api.modules.career"]
