name: Android emulator verification
on:
  pull_request:
    paths:
      - '.github/workflows/android-emulator.yml'
      - 'scripts/android/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  android-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies and start isolated application
        run: |
          cd apps/web && npm ci && npx playwright install android && cd ../..
          python scripts/pilot.py init --simulation
          python scripts/pilot.py start --simulation
          mkdir -p "$RUNNER_TEMP/android-evidence"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Chrome inside Android, including the native share picker
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_EVIDENCE: ${{ runner.temp }}/android-evidence
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          script: node scripts/android/verify-mobile.cjs
      - name: Preserve application logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/android-evidence"
          docker compose -p oscar-simulation --env-file .env.simulation -f compose.pilot.yml logs --no-color >"$RUNNER_TEMP/android-evidence/application.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: ${{ runner.temp }}/android-evidence/
          retention-days: 14
      - name: Stop owned simulation stack
        if: always()
        run: test ! -f .env.simulation || python scripts/pilot.py stop --simulation
