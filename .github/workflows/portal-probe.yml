name: Job portal compatibility probe
on:
  push:
    branches: [test/job-portals-20261102]
permissions:
  contents: read
jobs:
  portals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oscar
          POSTGRES_PASSWORD: oscar
          POSTGRES_DB: oscar_simulation_portals
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U oscar -d oscar_simulation_portals" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool ffmpeg xauth
          (cd apps/api && uv sync --frozen --python 3.12)
          (cd apps/extension && npm ci && npm run check && npm run build)
          (cd apps/web && npm ci && npx playwright install --with-deps chromium)
      - name: Probe six public job pages with native extension popup
        env:
          DEMO_OUTPUT: ${{ runner.temp }}/portal-probe
        run: |
          set -euo pipefail
          mkdir -p "$DEMO_OUTPUT"
          (cd apps/api && exec .venv/bin/python scripts/serve_simulation.py --database-url postgresql+psycopg://oscar:oscar@127.0.0.1:5432/oscar_simulation_portals --storage-dir "$DEMO_OUTPUT/pdf" --port 8000) >"$DEMO_OUTPUT/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8000/health | jq -e '.env == "simulation" and .db == "ok"'
          xvfb-run -a -s '-screen 0 1280x820x24' node scripts/extension/probe-portals.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-compatibility-evidence
          path: ${{ runner.temp }}/portal-probe
          retention-days: 14
